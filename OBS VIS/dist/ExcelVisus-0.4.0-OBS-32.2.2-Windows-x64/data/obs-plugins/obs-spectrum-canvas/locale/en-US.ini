Analysis.FftSize="FFT resolution"
Analysis.FftSize.Help="How many recent audio samples are analyzed at once. Higher values separate nearby bass frequencies more accurately, but react a little more slowly and use more processing. 2048 is a good default; use 4096 for detailed music and 1024 for faster speech response."
Analysis.Bands="Number of bars / points"
Analysis.Bands.Help="Controls how many spectrum bars, dots, or radial segments are drawn. Horizontal mirroring draws this many on each side."
Analysis.WaveformPoints="Waveform detail"
Analysis.MinFrequency="Minimum frequency (Hz)"
Analysis.MaxFrequency="Maximum frequency (Hz)"
Analysis.Logarithmic="Logarithmic frequency spacing"
Analysis.Logarithmic.Help="Gives bass frequencies more visual space, similar to how musical pitch and human hearing work. Recommended for music. Turn it off for equal-Hz spacing used in technical analysis."
Analysis.FloorDb="Noise floor (dB)"
Analysis.FloorDb.Help="The quietest level that becomes visible. More negative values reveal quieter sound and room noise; less negative values suppress background noise."
Analysis.CeilingDb="Maximum level (dB)"
Analysis.GainDb="Sensitivity / analysis gain (dB)"
Analysis.GainDb.Help="This is the main movement sensitivity control. Increase it for taller, more active bars at the same volume; decrease it if the visualizer is constantly maxed out."
Analysis.Attack="Attack smoothing (ms)"
Analysis.Release="Release smoothing (ms)"
Analysis.PeakHold="Peak hold (ms)"
Analysis.PeakDecay="Peak decay (units/second)"
